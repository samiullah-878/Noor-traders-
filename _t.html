<!doctype html><html class="lt t-frost"><head><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href="/style.css"><link rel=stylesheet href="/themes.css"></head><body><main><header><div class="summary" id="summary"><div class="stock-head sale-head pp-head" data-pp-root="1">
    <div class="pp-modes"><button type="button" class="on">🧾 Items wali bill</button></div>
    
    
    <div class="pp-sup"><span class="pp-av" aria-hidden="true">NF</span><div class="pp-sup-t"><small>Supplier</small><b>NABEEL FAISLABAD RICE</b></div><button type="button" data-pp-sup-change="">Badlein</button></div>
    <div class="pp-meta">
      <label class="pp-need">Godam (sab items)<select data-pp-godam="1"><option value="0" selected="" disabled="">— Godam chunein —</option><option value="1">Godam 1</option><option value="2">Godam 2</option></select></label>
      <label>Supplier bill # <input maxlength="40" data-pp-inv="1" value="" placeholder="ikhtiyari"></label>
    </div>
    <div class="pp-meta pp-add">
      <label>+ % (har item par)<input type="number" min="0" step="any" inputmode="decimal" data-pp-pct="1" value="" placeholder="0"></label>
      <label>Mazdoori / kharcha Rs<input type="number" min="0" step="any" inputmode="decimal" data-pp-xtra="1" value="" placeholder="0"></label>
    </div>
    <div class="mchips pct-chips" id="ppPctChips"><small>+% jaldi:</small><button type="button" class="rc" data-pp-pctc="0.5">0.5%</button><button type="button" class="rc" data-pp-pctc="1">1%</button><button type="button" class="rc" data-pp-pctc="1.5">1.5%</button><button type="button" class="rc" data-pp-pctc="2">2%</button><button type="button" class="rc" data-pp-pctc="3">3%</button></div>
    <p class="stat-note pp-addnote" id="ppXtraNote">Bill par % ya mazdoori / kiraya ho to upar likhein — har item ki khareed mein jud jayega.</p>
    <div class="sale-total"><small>Purchase · 0 items</small><strong id="ppTotal">Rs 0</strong></div>
    <div class="account-tools"><button class="sh-wide" id="ppTodayBtn" data-pp-today="1">📋 Aaj ke app purchase (0)</button><button class="sh-wide" data-pp-ai="1">🤖 Bill ki tasveer se items</button><button class="sh-wide" data-pp-pcbills="1">✏️ PC ka bill edit karein</button><button data-pp-copy="1">📑 Pichhla bill copy</button></div>
  </div></div></header><section class="workspace"><div id="list"><div class="sale-camrow"><button type="button" class="sale-cam" data-pp-camera="1">📷 Scan</button><button type="button" class="sale-mic" data-pp-mic="1" title="Awaz se">🎤</button><span class="stat-note">Wohi item dobara = +1 Ctn</span></div><div class="empty"><strong>Naya purchase bill</strong><p>Upar supplier chunein, phir item ka naam likhein ya 📷 se scan karein.</p></div></div></section></main></body></html>
