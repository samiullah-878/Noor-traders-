<body>
<div id="app" class="app" data-screen="boot">
  <div class="boot">
    <div class="boot-mark" aria-hidden="true">NT</div>
    <p class="boot-name">Noor Traders Hazri</p>
    <p class="boot-text" id="bootText">Khul raha hai…</p>
  </div>
</div>
<script>
/* v215: pichli screen foran dikhao (app ka JS aane se bhi pehle). Sirf login shuda phone par, 7 din tak. */
window.__ntT0=(window.performance&&performance.now)?performance.now():0;
(function(){try{
  var ls=window.localStorage,s=JSON.parse(ls.getItem('nt-hazri-snap-v1')||'null');
  if(!s||!s.html||Date.now()-s.at>6048e5)return;
  if(!(ls.getItem('nt-hazri-session-v200')||ls.getItem('nt-hazri-owner-in')==='1'))return;
  if(/login=/.test(location.hash))return;
  var a=document.getElementById('app');if(!a)return;
  a.innerHTML=s.html;a.setAttribute('data-screen','snapshot');a.setAttribute('data-snap-role',s.role||'');
  document.documentElement.className+=' is-snap';
}catch(e){}})();
</script>
<div id="sheetHost"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Is app ke liye browser mein JavaScript on honi chahiye.</p></noscript>
<script>
/* v211: app khud theek ho. __ntRepair = purani copy (service worker + cache) mita kar taza kholna. */
window.__ntRepair=function(){var done=function(){location.replace(location.pathname+'?r='+Date.now()+(location.hash||''))};
  try{var jobs=[];if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));
  if(window.caches&&caches.keys)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}));
  Promise.all(jobs).then(done,done)}catch(e){done()}};
window.__ntBootMsg=function(html){var t=document.getElementById('bootText');if(t&&document.querySelector('#app[data-screen=boot]')){t.innerHTML=html;return}
  if(document.querySelector('#app[data-screen=snapshot]')){var b=document.getElementById('snapMsg');if(!b){b=document.createElement('div');b.id='snapMsg';b.className='snap-msg';document.body.appendChild(b)}b.innerHTML=html}};
/* 15 second mein na khule: internet band ho to wohi batao, warna "taza kholein" (purani copy mita kar). */
window.__bootTimer=setTimeout(function(){if(!document.querySelector('#app[data-screen=boot],#app[data-screen=snapshot]'))return;
  var off=navigator.onLine===false;
  window.__ntBootMsg((off?'Internet band hai. Internet on kar ke dobara kholein.':'App der se khul rahi hai.')+'<br><button type="button" onclick="window.__ntRepair()" class="btn btn-ghost" style="margin-top:12px">Taza kholein</button>')},15000);
</script>
<script type="module" src="./boot.js?v=215"></script>
</body>
